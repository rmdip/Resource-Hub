<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Semester Resource Hub</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poiret+One&family=Josefin+Sans:wght@300;400;600&display=swap">
<style>
:root{--bg:#fff;--tx:#000;--mu:#6f6f6f;--ln:#000;--sf:#f2f2f2;--gr:rgba(0,0,0,.05);
--dec:"Poiret One","Josefin Sans","Futura","Century Gothic",system-ui,sans-serif;--bod:"Josefin Sans","Futura","Century Gothic",system-ui,sans-serif;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000;--tx:#fff;--mu:#8f8f8f;--ln:#fff;--sf:#111;--gr:rgba(255,255,255,.06)}}
:root[data-theme="dark"]{--bg:#000;--tx:#fff;--mu:#8f8f8f;--ln:#fff;--sf:#111;--gr:rgba(255,255,255,.06)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:400 16px/1.55 var(--bod);background-image:linear-gradient(var(--gr) 1px,transparent 1px),linear-gradient(90deg,var(--gr) 1px,transparent 1px);background-size:32px 32px;transition:background-color .25s,color .25s}
main{max-width:720px;margin:0 auto;padding:22px 18px 56px;min-height:100vh}
header{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding-bottom:18px;border-bottom:1px solid var(--ln);position:relative;margin-bottom:18px}
header:after{content:"";position:absolute;left:0;right:0;bottom:-5px;border-bottom:1px solid var(--ln);opacity:.35}
h1{font:400 clamp(26px,7vw,40px)/1.05 var(--dec);letter-spacing:.14em;text-transform:uppercase;margin:0;cursor:pointer}
.tag{font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:var(--mu);margin:8px 0 0}
.tools{display:flex;gap:8px;align-items:center}
#theme{border:1px solid var(--ln);background:none;color:var(--tx);width:42px;height:42px;border-radius:50%;cursor:pointer;font-size:16px;flex:none;display:grid;place-items:center}
#theme:hover{background:var(--tx);color:var(--bg)}
.sm{border:1px solid var(--ln);background:var(--bg);color:var(--tx);padding:5px 12px;font:400 11px var(--bod);letter-spacing:.24em;text-transform:uppercase;cursor:pointer;transition:.15s}
.sm:hover{background:var(--tx);color:var(--bg)}.sm[hidden]{display:none}
#bar{display:flex;gap:14px;align-items:flex-start}
#crumbs{flex:1;display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:0 0 22px;min-height:22px;font-size:11px;letter-spacing:.24em;text-transform:uppercase}
#crumbs button{background:none;border:0;color:var(--mu);font:inherit;letter-spacing:inherit;text-transform:inherit;cursor:pointer;padding:0}
#crumbs button:hover{color:var(--tx);text-decoration:underline}
#crumbs .sep{color:var(--mu)}
.fade{animation:in .32s ease both}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
h2{font:400 22px/1.1 var(--dec);letter-spacing:.2em;text-transform:uppercase;margin:0 0 18px;display:flex;align-items:baseline;gap:12px;word-break:break-word}
h2 i{font:300 11px var(--bod);letter-spacing:.3em;color:var(--mu);font-style:normal;flex:none}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.cell{position:relative;display:flex}.cell .opt{width:100%}
.opt{border:1px solid var(--ln);background:var(--bg);color:var(--tx);padding:18px 14px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:8px;transition:.15s;font-family:var(--bod);min-height:104px;justify-content:space-between}
.opt:hover,.opt:focus-visible{background:var(--tx);color:var(--bg);outline:0}
.opt .big{font:400 30px/1.05 var(--dec);letter-spacing:.08em;word-break:break-word}
.opt.txt .big{font-size:22px}
.opt .small{font-size:10px;letter-spacing:.26em;text-transform:uppercase;opacity:.65}
.opt.done{border-width:2px;position:relative;overflow:hidden}
.opt.done:after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,var(--mu),transparent);opacity:.35;animation:sh 3.4s ease-in-out infinite}
@keyframes sh{to{left:130%}}
.del{position:absolute;top:6px;right:6px;background:var(--bg);border:1px solid var(--ln);color:var(--tx);font:400 11px var(--bod);letter-spacing:.14em;text-transform:uppercase;cursor:pointer;padding:1px 7px}
.del:hover{background:var(--tx);color:var(--bg)}
.banner{border:1px solid var(--ln);padding:10px 14px;margin-bottom:20px;display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:11px;letter-spacing:.26em;text-transform:uppercase;position:relative;overflow:hidden}
.banner.done{border-width:2px}
.banner.done:before{content:"";position:absolute;left:0;bottom:0;height:3px;background:var(--tx);animation:ln 1.1s ease both}
@keyframes ln{from{width:0}to{width:100%}}
.panel{border:1px solid var(--ln);padding:16px;background:var(--bg);position:relative;margin-top:22px}
.panel:before,.panel:after{content:"";position:absolute;width:10px;height:10px;border:solid var(--ln)}
.panel:before{top:-1px;left:-1px;border-width:3px 0 0 3px}.panel:after{bottom:-1px;right:-1px;border-width:0 3px 3px 0}
label{display:block;font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:var(--mu);margin:14px 0 4px}label.f{margin-top:0}
input,select{width:100%;padding:10px 2px;border:0;border-bottom:1px solid var(--ln);border-radius:0;background:transparent;color:var(--tx);font:400 16px var(--bod);outline:0}
input:focus,select:focus{border-bottom-width:2px;padding-bottom:9px}
select option{background:var(--bg);color:var(--tx)}
button.p{margin-top:16px;background:var(--tx);color:var(--bg);border:1px solid var(--tx);padding:11px 22px;font:600 12px var(--bod);letter-spacing:.28em;text-transform:uppercase;cursor:pointer}
button.p:hover{background:var(--bg);color:var(--tx)}
.res{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:13px 0;border-bottom:1px solid var(--mu)}
.res a{color:var(--tx);text-decoration:none;word-break:break-word;border-bottom:1px solid transparent}.res a:hover{border-bottom-color:var(--tx)}
.k{font-size:10px;letter-spacing:.2em;border:1px solid var(--ln);padding:1px 6px;margin-right:8px;text-transform:uppercase}
.acts{display:flex;gap:6px;flex:none}
.sub{font-size:13px;color:var(--mu);letter-spacing:.06em}
.err{font-size:12px;min-height:18px;margin-top:6px;letter-spacing:.08em}
#cele{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:var(--bg);animation:cf .4s ease both;cursor:pointer;color:var(--tx)}
@keyframes cf{from{opacity:0}to{opacity:.97}}
#cele svg{position:absolute;width:min(92vmin,660px);height:auto}
.spin{transform-origin:200px 200px;animation:sp 14s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.ray{stroke:currentColor;stroke-width:1.2;stroke-dasharray:1;stroke-dashoffset:1;animation:dr .9s ease-out forwards}@keyframes dr{to{stroke-dashoffset:0}}
.ring{fill:none;stroke:currentColor;stroke-width:1;transform-origin:200px 200px;animation:rg 1.6s ease-out both}@keyframes rg{from{transform:scale(.1);opacity:1}to{transform:scale(1);opacity:0}}
.ct{position:relative;text-align:center;animation:in .7s .35s ease both}
.big2{font:400 clamp(34px,10vw,64px)/1.1 var(--dec);letter-spacing:.2em;text-transform:uppercase;margin-top:6px}
#ask{position:fixed;inset:0;z-index:40;display:grid;place-items:center;background:var(--bg);padding:20px;background-image:linear-gradient(var(--gr) 1px,transparent 1px),linear-gradient(90deg,var(--gr) 1px,transparent 1px);background-size:32px 32px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important}}
</style></head><body><main>
<header><div><h1 id="home">Resource Hub</h1><p class="tag">Semester &middot; Subject &middot; Exam</p><p class="tag" id="st" style="margin-top:4px"></p></div>
<div class="tools"><button class="sm" id="mysem" title="Change my semester" hidden></button><button class="sm" id="auth">Sign in</button><button id="theme" aria-label="Toggle dark mode">&#9680;</button></div></header>
<div id="authbox"></div>
<div id="bar"><button class="sm" id="back" hidden>&larr; Back</button><nav id="crumbs" aria-label="Breadcrumb"></nav></div>
<div id="view"></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script>
var EX=["Mid","Final","Quiz"],C=window.CONFIG||{},sb=null,user=null,admin=false,SUBJ=[],RES=[],DONE={},sem=null,sub=null,ex=null,mySem=null;
try{mySem=parseInt(localStorage.getItem("hub.mysem"))||null}catch(e){}
var view=document.getElementById("view"),crumbs=document.getElementById("crumbs"),root=document.documentElement;
function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
function pad(n){return n<10?"0"+n:""+n}
function st(m){document.getElementById("st").textContent=m}
try{var th=localStorage.getItem("hub.theme");if(th)root.setAttribute("data-theme",th)}catch(e){}
document.getElementById("theme").onclick=function(){var cur=root.getAttribute("data-theme")||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"),n=cur==="dark"?"light":"dark";root.setAttribute("data-theme",n);try{localStorage.setItem("hub.theme",n)}catch(e){}};
/* data helpers */
function subOf(id){return SUBJ.filter(function(s){return s.id===id})[0]}
function subsIn(s){return SUBJ.filter(function(x){return x.semester===s})}
function resOf(id,x){return RES.filter(function(r){return r.subject_id===id&&(!x||r.exam===x)})}
function done(s){return !!(DONE[s]||(mySem&&s<mySem))}
async function load(){
 if(!sb)return;
 var a=await sb.from("subjects").select("*").order("name"),b=await sb.from("resources").select("*").order("created_at"),c=await sb.from("semester_status").select("*");
 if(a.error||b.error||c.error){st("Could not load data");return}
 SUBJ=a.data;RES=b.data;DONE={};c.data.forEach(function(r){DONE[r.semester]=r.done});st("");render()}
async function refreshUser(){
 var r=await sb.auth.getSession();user=r.data.session?r.data.session.user:null;admin=false;
 if(user){var q=await sb.from("admins").select("user_id").eq("user_id",user.id).maybeSingle();admin=!!q.data}
 document.getElementById("auth").textContent=user?"Sign out":"Sign in";
 if(user)document.getElementById("authbox").innerHTML="";
 await load()}
/* auth */
document.getElementById("auth").onclick=async function(){
 if(!sb){st("Supabase is not configured in config.js yet");return}
 if(user){await sb.auth.signOut();return}
 var b=document.getElementById("authbox");if(b.firstChild){b.innerHTML="";return}
 var p=el("div","panel");p.style.marginTop="0";p.style.marginBottom="18px";
 p.innerHTML='<button class="p" id="goog" style="margin-top:0;width:100%">Continue with Google</button><div class="err" id="gerr"></div><label for="em">Or use any email (Gmail works) — we send a sign-in link</label><input id="em" type="email" placeholder="you@example.com"><div class="err" id="aerr"></div><button class="p" id="send">Send link</button>';
 b.appendChild(p);
 document.getElementById("goog").onclick=async function(){
  var r=await sb.auth.signInWithOAuth({provider:"google",options:{redirectTo:location.origin}});
  if(r.error)document.getElementById("gerr").textContent=r.error.message};
 document.getElementById("send").onclick=async function(){
  var v=document.getElementById("em").value.trim(),e=document.getElementById("aerr");if(!v){e.textContent="Enter your email.";return}
  var r=await sb.auth.signInWithOtp({email:v,options:{emailRedirectTo:location.origin}});
  e.textContent=r.error?r.error.message:"Check your email for the link."}};
/* navigation */
function go(s,b,x){sem=s;sub=b;ex=x;try{history.pushState({s:s,b:b,x:x},"")}catch(e){}render();window.scrollTo(0,0)}
function back(){if(ex)go(sem,sub,null);else if(sub)go(sem,null,null);else if(sem)go(null,null,null)}
document.getElementById("back").onclick=back;
document.getElementById("home").onclick=function(){go(null,null,null)};
window.addEventListener("popstate",function(e){var s=e.state||{};sem=s.s||null;sub=s.b||null;ex=s.x||null;render()});
document.addEventListener("keydown",function(e){if(e.key==="Escape"&&!/INPUT|SELECT/.test((document.activeElement||{}).tagName||""))back()});
function opt(big,small,fn,txt){var b=el("button","opt"+(txt?" txt":""));b.appendChild(el("span","big",big));b.appendChild(el("span","small",small));b.onclick=fn;return b}
function head(n,t){var h=el("h2");h.appendChild(el("i",null,n));h.appendChild(document.createTextNode(t));return h}
function arm(b,label,fn){b.onclick=function(e){e.stopPropagation();if(b.dataset.s){fn()}else{b.dataset.s=1;var o=b.textContent;b.textContent="Sure?";setTimeout(function(){b.dataset.s="";b.textContent=o},3000)}}}
function celebrate(top,big){
 var o=el("div");o.id="cele";var NS="http://www.w3.org/2000/svg",s=document.createElementNS(NS,"svg");s.setAttribute("viewBox","0 0 400 400");
 var g=document.createElementNS(NS,"g");g.setAttribute("class","spin");s.appendChild(g);
 for(var i=0;i<24;i++){var a=i*Math.PI/12,r1=i%2?90:60,r2=i%2?150:195,l=document.createElementNS(NS,"line");
  l.setAttribute("x1",200+r1*Math.cos(a));l.setAttribute("y1",200+r1*Math.sin(a));l.setAttribute("x2",200+r2*Math.cos(a));l.setAttribute("y2",200+r2*Math.sin(a));
  l.setAttribute("pathLength","1");l.setAttribute("class","ray");l.style.animationDelay=(i*25)+"ms";g.appendChild(l)}
 [0,1,2].forEach(function(k){var c=document.createElementNS(NS,"circle");c.setAttribute("cx",200);c.setAttribute("cy",200);c.setAttribute("r",190);c.setAttribute("class","ring");c.style.animationDelay=(k*280)+"ms";s.appendChild(c)});
 var t=el("div","ct");t.appendChild(el("div","tag",top));t.appendChild(el("div","big2",big));
 o.appendChild(s);o.appendChild(t);document.body.appendChild(o);
 function close(){if(o.parentNode)o.parentNode.removeChild(o)}o.onclick=close;setTimeout(close,2800)}
function needLogin(w){w.appendChild(el("p","sub","Sign in (top right) to add subjects and resources."))}
/* render */
function render(){
 view.innerHTML="";var w=el("div","fade");view.appendChild(w);crumbs.innerHTML="";
 if(!sb){w.appendChild(el("p","sub","Set SUPABASE_URL and SUPABASE_ANON_KEY in config.js."));return}
 var subj=sub?subOf(sub):null;if(sub&&!subj){sub=null;ex=null}
 var path=[["Home",function(){go(null,null,null)}]];
 if(sem)path.push(["Semester "+pad(sem),function(){go(sem,null,null)}]);
 if(subj)path.push([subj.name,function(){go(sem,sub,null)}]);
 if(ex)path.push([ex,null]);
 document.getElementById("back").hidden=!sem;
 if(path.length>1)path.forEach(function(p,i){if(i)crumbs.appendChild(el("span","sep","/"));
  if(p[1]&&i<path.length-1){var b=el("button",null,p[0]);b.onclick=p[1];crumbs.appendChild(b)}else crumbs.appendChild(el("span",null,p[0]))});
 if(!sem){w.appendChild(head("01","Choose semester"));var g=el("div","grid");
  for(var i=1;i<=12;i++)(function(i){var o=opt(pad(i),subsIn(i).length+" subjects"+(done(i)?" \u00b7 \u2713 finished":"")+(mySem===i?" \u00b7 you":""),function(){go(i,null,null)});if(done(i))o.className+=" done";g.appendChild(o)})(i);
  w.appendChild(g);return}
 if(!subj){w.appendChild(head("02","Semester "+pad(sem)));
  var bn=el("div","banner"+(done(sem)?" done":""));bn.appendChild(el("span",null,done(sem)?"\u2713 Semester complete":"In progress"));
  if(admin&&!(mySem&&sem<mySem)){var tb=el("button","sm",done(sem)?"Reopen":"Mark finished");tb.onclick=async function(){var v=!done(sem);var r=await sb.from("semester_status").upsert({semester:sem,done:v});if(r.error){st(r.error.message);return}DONE[sem]=v;render();if(v)celebrate("Semester "+pad(sem),"Complete")};bn.appendChild(tb)}
  w.appendChild(bn);
  var list=subsIn(sem),g2=el("div","grid");if(!list.length)w.appendChild(el("p","sub","No subjects yet."));
  list.forEach(function(s){var c=el("div","cell");c.appendChild(opt(s.name,resOf(s.id).length+" resources",function(){go(sem,s.id,null)},true));
   if(admin||(user&&s.created_by===user.id)){var x=el("button","del","\u00d7");x.title="Delete subject";arm(x,"",async function(){var r=await sb.from("subjects").delete().eq("id",s.id);if(r.error)st(r.error.message);await load()});c.appendChild(x)}
   g2.appendChild(c)});w.appendChild(g2);
  if(!user){needLogin(w);return}
  var p=el("div","panel");p.innerHTML='<label class="f" for="ns">Add a subject</label><input id="ns" placeholder="e.g. Data Structures (CSE 221)"><div class="err" id="err"></div><button class="p" id="addSub">Add subject</button>';w.appendChild(p);
  var add=async function(){var v=document.getElementById("ns").value.trim(),e=document.getElementById("err");if(!v)return;
   if(list.some(function(s){return s.name.toLowerCase()===v.toLowerCase()})){e.textContent="That subject already exists.";return}
   var r=await sb.from("subjects").insert({semester:sem,name:v});if(r.error){e.textContent=r.error.message;return}await load()};
  document.getElementById("addSub").onclick=add;document.getElementById("ns").onkeydown=function(e){if(e.key==="Enter")add()};return}
 if(!ex){w.appendChild(head("03",subj.name));var g3=el("div","grid");
  EX.forEach(function(x){g3.appendChild(opt(x,resOf(sub,x).length+" resources",function(){go(sem,sub,x)}))});w.appendChild(g3);return}
 w.appendChild(head("04",ex));var items=resOf(sub,ex),l=el("div");
 if(!items.length)l.appendChild(el("p","sub","No "+ex+" resources yet."));
 items.forEach(function(r){var row=el("div","res"),c=el("div");c.appendChild(el("span","k",r.kind==="yt"?"Video":"File"));
  if(!r.approved)c.appendChild(el("span","k","Pending"));
  var a=el("a",null,r.title);a.href=r.url;a.target="_blank";a.rel="noopener noreferrer";c.appendChild(a);row.appendChild(c);
  var acts=el("div","acts");
  if(admin&&!r.approved){var ap=el("button","sm","Approve");ap.onclick=async function(){var q=await sb.from("resources").update({approved:true}).eq("id",r.id);if(q.error)st(q.error.message);await load()};acts.appendChild(ap)}
  if(admin||(user&&r.created_by===user.id)){var x=el("button","sm","\u00d7");arm(x,"",async function(){var q=await sb.from("resources").delete().eq("id",r.id);if(q.error)st(q.error.message);await load()});acts.appendChild(x)}
  row.appendChild(acts);l.appendChild(row)});w.appendChild(l);
 if(!user){needLogin(w);return}
 var f=el("div","panel");f.innerHTML='<label class="f" for="t">Title</label><input id="t" placeholder="e.g. 2025 question + solution"><label for="k">Type</label><select id="k"><option value="drive">Drive file</option><option value="yt">YouTube tutorial</option></select><label for="u">Link</label><input id="u" inputmode="url" placeholder="https://drive.google.com/ or https://youtu.be/"><div class="err" id="err"></div><button class="p" id="addRes">'+(admin?"Add resource":"Submit for approval")+'</button>';w.appendChild(f);
 document.getElementById("addRes").onclick=async function(){
  var t=document.getElementById("t").value.trim(),u=document.getElementById("u").value.trim(),k=document.getElementById("k").value,er=document.getElementById("err");
  if(!t||!u){er.textContent="Add a title and a link.";return}if(!/^https?:\/\//i.test(u))u="https://"+u;
  if(k==="yt"?!/^https:\/\/((www|m)\.)?(youtube\.com|youtu\.be)\//.test(u):!/^https:\/\/(drive|docs)\.google\.com\//.test(u)){er.textContent=k==="yt"?"Please use a YouTube link.":"Please use a Google Drive link.";return}
  if(items.some(function(r){return r.url===u})){er.textContent="That link is already added.";return}
  var r=await sb.from("resources").insert({subject_id:sub,exam:ex,kind:k,title:t,url:u,approved:admin});
  if(r.error){er.textContent=r.error.message;return}await load();if(!admin)st("Submitted \u2014 an admin will approve it.")}}
/* which semester are you in */
function upd(){var b=document.getElementById("mysem");b.hidden=!mySem;b.textContent=mySem?"Sem "+pad(mySem):""}
function askSem(first){
 if(document.getElementById("ask"))return;
 var o=el("div");o.id="ask";var w=el("div","fade panel");w.style.cssText="max-width:520px;width:100%;margin:0";
 w.appendChild(head("\u25c6","Which semester are you in?"));
 w.appendChild(el("p","sub","Your earlier semesters will be marked finished automatically."));
 var g=el("div","grid");g.style.gridTemplateColumns="repeat(auto-fill,minmax(70px,1fr))";g.style.marginTop="14px";
 for(var i=1;i<=12;i++)(function(i){var b=el("button","opt");b.style.minHeight="64px";b.style.padding="12px";b.appendChild(el("span","big",pad(i)));
  b.onclick=function(){document.body.removeChild(o);mySem=i;try{localStorage.setItem("hub.mysem",i)}catch(e){}upd();go(null,null,null);
   if(i>1)celebrate(i===2?"Semester 01":"Semesters 01 \u2013 "+pad(i-1),"Finished")};g.appendChild(b)})(i);
 w.appendChild(g);
 if(!first){var c=el("button","sm","Cancel");c.style.marginTop="16px";c.onclick=function(){document.body.removeChild(o)};w.appendChild(c)}
 o.appendChild(w);document.body.appendChild(o)}
document.getElementById("mysem").onclick=function(){askSem(false)};
/* boot */
var cfgOK=C.SUPABASE_URL&&C.SUPABASE_ANON_KEY&&C.SUPABASE_URL.indexOf("YOUR-")<0&&C.SUPABASE_ANON_KEY.indexOf("YOUR-")<0;
try{if(!cfgOK)throw 0;sb=supabase.createClient(C.SUPABASE_URL,C.SUPABASE_ANON_KEY);sb.auth.onAuthStateChange(function(){refreshUser()})}catch(e){sb=null}
render();upd();if(sb)refreshUser();if(!mySem)askSem(true);
</script></body></html>
